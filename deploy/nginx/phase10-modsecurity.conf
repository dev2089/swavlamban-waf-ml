# Minimal deterministic ModSecurity policy used by the Phase 10 open-source WAF integration.
# The nginx connector executes this before proxying to the ML gateway/upstream.
SecRuleEngine On
SecRequestBodyAccess On
SecRequestBodyLimit 1048576
SecRequestBodyNoFilesLimit 1048576
SecAuditEngine RelevantOnly
SecAuditLog /tmp/swavlamban-phase10-modsecurity-audit.log
SecAuditLogType Serial

SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx (?i)(union\\s+select|or\\s+\\d+\\s*=\\s*\\d+|drop\\s+table)" "id:1001001,phase:2,deny,status:403,log,auditlog,msg:'Swavlamban SQL injection signature'"
SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx (?i)<\\s*script\\b|javascript\\s*:|on(?:error|load|click)\\s*=" "id:1001002,phase:2,deny,status:403,log,auditlog,msg:'Swavlamban XSS signature'"
SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx (?i)(?:;\\s*(?:cat|id|uname|curl|wget|bash|sh)\\b|\\$\\(|`[^`]+`|&&|\\|\\|)" "id:1001003,phase:2,deny,status:403,log,auditlog,msg:'Swavlamban command injection signature'"
