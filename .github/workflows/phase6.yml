name: phase6-verification
on:
  push:
    branches: [phase6-final]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-phase4.txt pytest
      - name: Train runtime model artifact
        run: python scripts/train_phase4_models.py --output models/phase4_models.joblib
      - name: Full regression
        run: python -m pytest -q
      - name: Compile gate
        run: python -m compileall -q waf tests scripts
      - name: Phase 6 master exam
        run: python scripts/phase6_master_exam.py
      - name: Build portable Phase 6 handoff archive
        run: python scripts/build_phase6_handoff.py
      - name: Upload Phase 6 handoff
        uses: actions/upload-artifact@v4
        with:
          name: waf-phase6-handoff
          path: WAF_PHASE6_FINAL_HANDOFF.zip
          if-no-files-found: error
          retention-days: 30
