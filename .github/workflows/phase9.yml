name: phase9-verification

on:
  push:
    branches: [phase9-final]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install WAF runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-phase4.txt
          pip install 'fastapi>=0.110,<1' 'uvicorn>=0.29,<1' 'pydantic>=2.6,<3' 'httpx>=0.27,<1' 'pytest>=8,<9'
      - name: Install local HTTPS tools
        run: sudo apt-get update && sudo apt-get install -y nginx openssl curl
      - name: Full regression
        run: python -m pytest -q
      - name: Compile gate
        run: python -m compileall -q waf tests scripts
      - name: Phase 8 continuity
        run: python -m pytest -q tests/test_phase8_security.py tests/test_phase8_security_hardening.py
      - name: Phase 9 master exam
        run: python scripts/phase9_master_exam.py
      - name: Record Phase 9 ledger
        run: python scripts/record_phase9_ledger.py
      - name: Build portable Phase 9 handoff
        run: python scripts/build_phase9_handoff.py
      - name: Upload Phase 9 handoff
        uses: actions/upload-artifact@v4
        with:
          name: waf-phase9-handoff
          path: WAF_PHASE9_FINAL_HANDOFF.zip
          if-no-files-found: error
