name: phase5-independent

on:
  workflow_dispatch:
  push:
    branches:
      - phase5-independent-final

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements-phase4.txt
      - name: Phase 5 gate
        run: python scripts/phase5_gate.py
