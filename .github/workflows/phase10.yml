name: phase10-release-candidate

on:
  push:
    branches: [phase10-final]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime, test, audit and browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-phase4.txt fastapi uvicorn pydantic httpx pytest pytest-asyncio python-pptx reportlab playwright
      - name: Install open-source WAF edge and browser tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx libnginx-mod-http-modsecurity openssl curl zip ffmpeg
          python -m playwright install --with-deps chromium
      - name: Materialize deterministic CI model artifact
        run: |
          python -c "from waf.ml.ensemble import Phase4MLEnsemble; Phase4MLEnsemble.train_default().save('/tmp/phase4_models.joblib')"
          install -m 0644 /tmp/phase4_models.joblib models/phase4_models.joblib
          test -s models/phase4_models.joblib
      - name: Compile
        run: python -m compileall -q waf tests scripts
      - name: Isolated gateway startup smoke
        run: python scripts/phase10_ci_startup_fix.py
      - name: Strict Phase 10 master exam
        run: python scripts/phase10_master_exam.py
      - name: Build binary submission artifacts
        run: python scripts/build_phase10_submission.py
      - name: Capture dependency inventory and exact clean commit
        run: |
          python -m pip freeze > artifacts/dependency_inventory.txt
          git rev-parse HEAD > artifacts/final_commit_sha.txt
          test -z "$(git status --porcelain --untracked-files=no)"
          git status --short > artifacts/clean_checkout_status.txt
      - name: Build portable auditor bundle
        run: python scripts/build_phase10_handoff.py
      - name: Record final bundle checksums
        run: |
          sha256sum WAF_PHASE10_FINAL_HANDOFF.zip | tee artifacts/WAF_PHASE10_FINAL_HANDOFF.sha256
          sha256sum WAF_PHASE10_FINAL_REPOSITORY.zip | tee artifacts/WAF_PHASE10_FINAL_REPOSITORY.sha256
      - name: Upload final auditor bundle
        uses: actions/upload-artifact@v4
        with:
          name: swavlamban-waf-phase10-auditor-handoff
          path: |
            WAF_PHASE10_FINAL_HANDOFF.zip
            artifacts/**
            handoff/**
            phase10_*evidence.json
            phase10_master_exam_result.json
          if-no-files-found: error
      - name: Upload repository source archive
        uses: actions/upload-artifact@v4
        with:
          name: swavlamban-waf-phase10-repository
          path: WAF_PHASE10_FINAL_REPOSITORY.zip
          if-no-files-found: error
