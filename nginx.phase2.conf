pid /tmp/swavlamban-waf-phase2.pid;
events {}
http {
  access_log /tmp/swavlamban-waf-access.log;
  error_log /tmp/swavlamban-waf-error.log notice;
  upstream swavlamban_waf { server 127.0.0.1:18080; }
  server {
    listen 18088;
    server_name localhost;
    client_max_body_size 1m;
    location / {
      proxy_pass http://swavlamban_waf;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection '';
    }
  }
}
