name: phase5-verification

on:
  push:
    branches: [phase5-final]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install WAF verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-phase4.txt pytest
      - name: Full regression
        run: python -m pytest -q
      - name: Compile gate
        run: python -m compileall -q waf tests
      - name: Phase 5 master exam
        run: python scripts/phase5_master_exam.py
      - name: Explanation overhead benchmark
        run: python phase5_explainability_benchmark.py
