[project]
name = 'waf-ml'
version = '0.4.0'
description = 'ML-augmented HTTP WAF security core and live edge'
requires-python = '>=3.11'

dependencies = [
  'numpy>=2.0,<3',
  'scikit-learn>=1.5,<2',
  'aiohttp>=3.9,<4',
  'joblib>=1.3,<2'
]

[tool.pytest.ini_options]
testpaths = ['tests']
pythonpath = ['.']
